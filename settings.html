<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Dynamica SmartRents</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <!-- ── Top Nav ── -->
  <nav class="topnav">
    <button class="burger-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="appDrawer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6"  x2="17" y2="6"/>
        <line x1="3" y1="10" x2="17" y2="10"/>
        <line x1="3" y1="14" x2="17" y2="14"/>
      </svg>
    </button>
    <a href="index.html" style="display:flex;align-items:center;gap:8px;margin-right:32px;text-decoration:none;flex-shrink:0;">
      <img src="engine_logo (2).png" style="height:28px;width:auto;display:block;" alt="Dynamica SmartRents">
      <div style="display:flex;flex-direction:column;line-height:1;gap:2px;">
        <span style="font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.18em;color:#ffffff;text-transform:uppercase;">DYNAMICA</span>
        <span style="font-family:'Inter',sans-serif;font-size:12px;font-weight:400;letter-spacing:0.02em;color:rgba(255,255,255,0.55);">SmartRents</span>
      </div>
    </a>
  </nav>

  <main class="settings-page">
    <div class="settings-header">
      <h1 class="settings-title">Settings</h1>
    </div>
    <div class="settings-body">
      <aside class="settings-sidebar" id="settingsSidebar">
        <button class="settings-sidebar-item active" type="button" data-section="account">Account</button>
        <button class="settings-sidebar-item"        type="button" data-section="notifications">Notifications</button>
        <button class="settings-sidebar-item"        type="button" data-section="integrations">Integrations</button>
        <button class="settings-sidebar-item"        type="button" data-section="billing">Billing</button>
        <button class="settings-sidebar-item"        type="button" data-section="security">Security</button>
      </aside>

      <section class="settings-content" id="settingsContent">
        <div class="settings-card" id="accountSection">
          <div class="settings-section-title">Account</div>
          <div class="settings-section-sub">Manage your personal profile and regional preferences.</div>

          <div class="settings-field">
            <label for="setName">Name</label>
            <input id="setName" class="settings-input" type="text" value="Tyler Hennessy" />
          </div>
          <div class="settings-field">
            <label for="setEmail">Email</label>
            <input id="setEmail" class="settings-input" type="email" value="tyler@dynamica.com" />
          </div>
          <div class="settings-field">
            <label for="setTz">Time zone</label>
            <select id="setTz" class="settings-select">
              <option>GMT (London)</option>
              <option>CET (Paris)</option>
              <option>EST (New York)</option>
              <option>CST (Chicago)</option>
              <option>PST (Los Angeles)</option>
              <option>JST (Tokyo)</option>
            </select>
          </div>

          <button class="settings-save-btn" type="button" id="settingsSave">Save changes</button>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- ── Slide-out drawer ── -->
<div class="drawer-backdrop"></div>
<aside class="drawer" id="appDrawer" aria-label="Main menu">
  <div class="drawer-header">
    <img src="engine_logo (2).png" alt="Dynamica">
    <div class="drawer-brand">
      <span class="wordmark">DYNAMICA</span>
      <span class="sub">SmartRents</span>
    </div>
    <button class="drawer-close" type="button" aria-label="Close menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <line x1="4"  y1="4"  x2="14" y2="14"/>
        <line x1="14" y1="4"  x2="4"  y2="14"/>
      </svg>
    </button>
  </div>
  <nav>
    <ul class="drawer-menu">
      <li>
        <a href="index.html" class="drawer-item">
          <span class="drawer-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5"  y="9"  width="3" height="6"  rx="0.8"/>
              <rect x="7.5"  y="5"  width="3" height="10" rx="0.8"/>
              <rect x="12.5" y="2"  width="3" height="13" rx="0.8"/>
            </svg>
          </span>
          Pricing
        </a>
      </li>
      <li>
        <a href="settings.html" class="drawer-item active">
          <span class="drawer-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="9" r="2.2"/>
              <path d="M9 1.6v1.7M9 14.7v1.7M16.4 9h-1.7M3.3 9H1.6M14.2 3.8l-1.2 1.2M5 13l-1.2 1.2M14.2 14.2L13 13M5 5L3.8 3.8"/>
            </svg>
          </span>
          Settings
        </a>
      </li>
      <li>
        <button class="drawer-item drawer-logout" type="button">
          <span class="drawer-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 13v1.2A1.3 1.3 0 0 1 9.7 15.5h-5.2A1.3 1.3 0 0 1 3.2 14.2V3.8A1.3 1.3 0 0 1 4.5 2.5h5.2A1.3 1.3 0 0 1 11 3.8V5"/>
              <path d="M7.5 9h8.4"/>
              <path d="M13.4 6.5L15.9 9 13.4 11.5"/>
            </svg>
          </span>
          Log out
        </button>
      </li>
    </ul>
  </nav>
</aside>
<div class="logout-overlay" aria-hidden="true">
  <div class="logout-spinner"></div>
</div>

<div class="app-toast" id="appToast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script>
  (function () {
    const sidebar = document.getElementById('settingsSidebar');
    const content = document.getElementById('settingsContent');
    const toast   = document.getElementById('appToast');

    const SECTION_LABELS = {
      account: 'Account',
      notifications: 'Notifications',
      integrations: 'Integrations',
      billing: 'Billing',
      security: 'Security',
    };

    const ACCOUNT_HTML = content.innerHTML;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function renderSection(key) {
      if (key === 'account') {
        content.innerHTML = ACCOUNT_HTML;
        wireSave();
        return;
      }
      const label = SECTION_LABELS[key] || 'Section';
      content.innerHTML =
        '<div class="settings-coming-soon">' +
        '<div class="settings-coming-soon-title">' + label + '</div>' +
        '<div class="settings-coming-soon-sub">Coming soon.</div>' +
        '</div>';
    }

    function wireSave() {
      const btn = document.getElementById('settingsSave');
      if (!btn) return;
      btn.addEventListener('click', () => showToast('Settings saved'));
    }

    sidebar.addEventListener('click', e => {
      const btn = e.target.closest('.settings-sidebar-item');
      if (!btn || btn.classList.contains('active')) return;
      sidebar.querySelectorAll('.settings-sidebar-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderSection(btn.dataset.section);
    });

    wireSave();
  })();
</script>

</body>
</html>
